name: PR CI API-DEMO

# "Docker CI Integration Tests" is a required status check, so this workflow
# triggers on every PR (no path filter at the `on:` level). A change-detection
# step decides whether api-demo/db-demo/shared were touched; the real test steps are
# gated on that result, while the job always runs to completion and reports a
# real success. This replaces the previous real + no-op twin pair, whose
# `paths` / `paths-ignore` triggers were not mutually exclusive and could both
# fire on a PR touching api-demo plus other paths.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-ci-api-demo-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Fast, Docker-free lint + type-check. The integration-tests job compiles the source
  # (Dockerfile.ci runs `npm run typecheck`) but never lints, and the integration tests
  # themselves run under vitest (transpiled, not type-checked) — this job covers both.
  # Mirrors the integration-tests change-detection: it always runs to report a real status,
  # gating the real steps on whether api-demo/db-demo/shared were touched.
  checks:
    name: API Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api-demo
    timeout-minutes: 10
    steps:
      # Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v5

      # Detect whether api-demo, db-demo or shared changed in this PR
      - name: Detect relevant changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'api-demo/**'
              - 'db-demo/**'
              - 'shared/**'
              - '.github/workflows/pr-ci-api-demo.yml'

      # Report success when there is nothing to check
      - name: Skip lint & type check
        if: steps.changes.outputs.relevant == 'false'
        run: echo "No api-demo, db-demo or shared changes - checks not required."

      # Set up Node.js with npm caching for both the root and the (separate) integration-test lockfiles
      - name: Set up Node.js
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api-demo/test/container-test/package-lock.json

      # Install workspace dependencies from the root lockfile
      - name: Install dependencies
        if: steps.changes.outputs.relevant == 'true'
        working-directory: .
        run: npm ci

      # The integration tests are a separate project with their own package.json (not a workspace);
      # install their deps BEFORE typecheck, because api-demo's tsconfig includes test/container-test/**
      # and those files import supertest/aws-sdk-client-mock from that project's own node_modules.
      - name: Install integration-test dependencies
        if: steps.changes.outputs.relevant == 'true'
        working-directory: ./api-demo/test/container-test
        run: npm ci

      # Lint (neostandard + api rules)
      - name: Lint
        if: steps.changes.outputs.relevant == 'true'
        run: npm run lint

      # Type-check src, scripts, and the integration tests (all three are in api-demo's tsconfig).
      # vitest runs the tests transpiled, so tsc is their only type gate; src is also built in Docker.
      - name: Type-check
        if: steps.changes.outputs.relevant == 'true'
        run: npm run typecheck

  integration-tests:
    name: API Integration Tests
    # Gate the expensive Docker build + integration run on the fast lint + type-check passing first,
    # so a lint/type error fails in ~1 min instead of after a ~15 min Docker cycle.
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api-demo
    timeout-minutes: 15
    env:
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
      COMPOSE_PROJECT_NAME: ci
      COMPOSE_FILE: docker-compose-ci.yml

    steps:
      # Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v5

      # Detect whether api-demo, db-demo or shared changed in this PR
      - name: Detect relevant changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'api-demo/**'
              - 'db-demo/**'
              - 'shared/**'
              - '.github/workflows/pr-ci-api-demo.yml'

      # Report success when there is nothing to test
      - name: Skip integration tests
        if: steps.changes.outputs.relevant == 'false'
        run: echo "No api-demo, db-demo or shared changes - integration tests not required."

      # Set up Docker Buildx for caching
      - name: Set up Docker Buildx
        if: steps.changes.outputs.relevant == 'true'
        uses: docker/setup-buildx-action@v4

      # Show Docker versions for debugging
      - name: Show Docker versions
        if: steps.changes.outputs.relevant == 'true'
        run: |
          docker --version
          docker compose version

      # Ensure clean compose state
      - name: Cleanup previous Docker Compose stack
        if: steps.changes.outputs.relevant == 'true'
        run: docker compose down -v --remove-orphans || true

      # Build images (with native Buildx caching)
      - name: Build API and Test images
        if: steps.changes.outputs.relevant == 'true'
        run: |
          docker compose build \
            --progress=plain \
            --pull \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            api test

      # Start DB and API services
      - name: Start DB and API
        if: steps.changes.outputs.relevant == 'true'
        run: docker compose up -d --wait db api

      # Run integration tests
      - name: Run integration tests
        if: steps.changes.outputs.relevant == 'true'
        run: docker compose up --abort-on-container-exit --exit-code-from test test

      # Dump logs if tests fail
      - name: Dump Docker Compose logs on failure
        if: failure() && steps.changes.outputs.relevant == 'true'
        run: docker compose logs --no-color

      # Teardown compose stack
      - name: Teardown Docker Compose stack
        if: always() && steps.changes.outputs.relevant == 'true'
        run: docker compose down -v --remove-orphans
