name: Deploy to S3 + CloudFront

on:
  push:
    branches:
      - master
    paths:
      - 'app-demo/**'
      - 'shared/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s3-deploy-master
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # Set up Node.js for the Vite build
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # Build the production bundle into app-demo/dist. Install at the workspaces
      # root (single lockfile); build the app-demo workspace only.
      - name: Install and build
        # Sentry source-map upload runs only when SENTRY_AUTH_TOKEN is set (see vite.config.ts);
        # until these are configured the build still succeeds, just without uploaded source maps.
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.APP_DEMO_SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.APP_DEMO_SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.APP_DEMO_SENTRY_PROJECT }}
        run: |
          npm ci
          npm run build --workspace=app-demo

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Upload content-hashed assets (dist/assets) — additive, no --delete. The new
      # hashes are added alongside the previous build's so the currently-live index.html
      # keeps resolving until it is replaced below. Safe to cache for a year, immutable.
      # Superseded assets are pruned at the end, after the cutover + invalidation.
      - name: Upload hashed assets to S3
        run: |
          aws s3 sync ./app-demo/dist/assets "s3://${{ vars.APP_DEMO_S3_BUCKET_NAME }}/assets" \
            --cache-control "public, max-age=31536000, immutable"

      # Upload remaining static files (favicon, etc.) — additive, no --delete, so the
      # currently-live index.html keeps resolving the files it references until it is
      # replaced below. Unfingerprinted, so use a short revalidating cache. Excludes
      # assets/ (handled above) and index.html (handled below). Stale files are pruned
      # at the end, after the cutover + invalidation.
      - name: Upload root static files to S3
        run: |
          aws s3 sync ./app-demo/dist "s3://${{ vars.APP_DEMO_S3_BUCKET_NAME }}" \
            --exclude "assets/*" \
            --exclude "index.html" \
            --cache-control "public, max-age=300, must-revalidate"

      # Upload the entry point last, never cached, so new bundles are picked up immediately
      - name: Upload index.html with no-cache
        run: |
          aws s3 cp ./app-demo/dist/index.html "s3://${{ vars.APP_DEMO_S3_BUCKET_NAME }}/index.html" \
            --cache-control "no-cache"

      # Invalidate the CloudFront edge cache
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.APP_DEMO_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

      # Prune superseded files — runs last, once the new index.html is live and the cache
      # invalidated, so no served HTML still references anything being removed. Covers both
      # the hashed assets and the unfingerprinted root files (e.g. an old flat-site script.js
      # on the migration deploy). index.html is excluded — it is the live entry point.
      # (If the run is cancelled before this step, stale files simply linger — harmless.)
      - name: Prune superseded assets from S3
        run: |
          aws s3 sync ./app-demo/dist/assets "s3://${{ vars.APP_DEMO_S3_BUCKET_NAME }}/assets" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Prune superseded root files from S3
        run: |
          aws s3 sync ./app-demo/dist "s3://${{ vars.APP_DEMO_S3_BUCKET_NAME }}" \
            --delete \
            --exclude "assets/*" \
            --exclude "index.html" \
            --cache-control "public, max-age=300, must-revalidate"
